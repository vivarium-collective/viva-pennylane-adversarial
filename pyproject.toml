[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-pennylane-adversarial"
version = "0.1.0"
description = "Process-bigraph wrapper for PennyLane adversarial attacks on QML classifiers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Alexander Patrie", email = "alexander@patrie.dev"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=1.5.0",
    "pennylane>=0.35",
    "torch>=2.0",
    "aiohttp",
    "fsspec",
    "h5py",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
    "polars",
    "scikit-learn>=1.3",
    "marimo[recommended]>=0.23.13",
]

[project.optional-dependencies]
# `dev` is the extra the workspace-ci workflow installs (`uv pip install
# -e ".[dev]"`) to get the test runner. pytest-timeout registers the
# `@pytest.mark.timeout` marker the pipeline tests use.
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[project.scripts]
adversarial = "app.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/pbg-pennylane-adversarial"
Issues = "https://github.com/anomalyco/pbg-pennylane-adversarial/issues"

[tool.hatch.build.targets.wheel]
packages = ["pbg_pennylane_adversarial", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# The workspace dashboard/publish runtime (import package `vivarium_dashboard`,
# CLI `vivarium-dashboard`) was renamed to the `vivarium-workbench` distribution;
# it isn't on PyPI, so resolve it from git main. The wheel still ships the
# `vivarium_dashboard` back-compat import shim + the `vivarium-dashboard` console
# script, so this repo's `from vivarium_dashboard...` imports and `serve` CMD
# keep working. Never commit a local absolute filesystem path as a uv source.
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[dependency-groups]
cli = [
    "typer>=0.26.8",
]
